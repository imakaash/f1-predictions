name: f1

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pip

  # data / numerics
  - numpy>=1.24
  - pandas>=2.0
  - pyarrow>=14.0

  # ML
  - scikit-learn>=1.3
  - xgboost>=2.0
  - lightgbm>=4.0

  # plotting
  - matplotlib>=3.7

  # utilities
  - joblib>=1.3

  # F1 data — not on conda-forge, install via pip
  - pip:
    - fastf1>=3.4.0
